name: Build FOCO Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Construir aplicación web
        run: npm run build

      - name: Instalar Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Sincronizar Capacitor
        run: npx cap sync android
      - name: Instalar herramientas para iconos
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          npm install -D @capacitor/assets

      - name: Crear icono Android desde FOCO
        run: |
          mkdir -p resources
          rsvg-convert -w 1024 -h 1024 public/fococon.svg -o resources/icon.png

      - name: Generar iconos nativos Android
        run: npx capacitor-assets generate --android
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Dar permisos a Gradle
        run: chmod +x android/gradlew

      - name: Generar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: FOCO-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
