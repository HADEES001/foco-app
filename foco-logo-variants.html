<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<title>FOCO — Logos</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #09090b;
    font-family: 'Inter', -apple-system, sans-serif;
    color: #f4f4f5;
    padding: 48px;
    display: flex;
    flex-direction: column;
    gap: 60px;
  }
  .section { display: flex; flex-direction: column; gap: 16px; }
  .label {
    font-size: 11px;
    color: #52525b;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 40px;
    flex-wrap: wrap;
  }
  .box {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .box span {
    font-size: 11px;
    color: #3f3f46;
  }
  .on-white {
    background: #fff;
    padding: 24px;
    border-radius: 16px;
  }
  .on-white svg rect[fill="#09090b"] { fill: #fff !important; }
  hr {
    border: none;
    border-top: 1px solid #1c1c1f;
  }
</style>
</head>
<body>

<div class="section">
  <p class="label">Ícono principal — 400×400</p>
  <div class="row">
    <div class="box">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="160" height="160">
        <rect width="400" height="400" rx="88" fill="#09090b"/>
        <circle cx="200" cy="200" r="130" fill="none" stroke="#1c1c1f" stroke-width="2"/>
        <defs>
          <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#f87171"/>
            <stop offset="50%" stop-color="#fbbf24"/>
            <stop offset="100%" stop-color="#4ade80"/>
          </linearGradient>
        </defs>
        <path d="M 80 200 A 120 120 0 0 1 320 200" fill="none" stroke="#1c1c1f" stroke-width="8" stroke-linecap="round"/>
        <path d="M 80 200 A 120 120 0 0 1 320 200" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
        <circle cx="285" cy="128" r="10" fill="#09090b" stroke="#4ade80" stroke-width="3"/>
        <circle cx="285" cy="128" r="5" fill="#4ade80"/>
        <text x="200" y="222" font-family="'Inter',-apple-system,sans-serif" font-size="120" font-weight="200" fill="#f4f4f5" text-anchor="middle" letter-spacing="-4">F</text>
        <circle cx="200" cy="260" r="6" fill="#4ade80"/>
      </svg>
      <span>Oscuro</span>
    </div>

    <div class="box">
      <div class="on-white">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="140" height="140">
          <rect width="400" height="400" rx="88" fill="#ffffff"/>
          <circle cx="200" cy="200" r="130" fill="none" stroke="#e5e5e5" stroke-width="2"/>
          <defs>
            <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#f87171"/>
              <stop offset="50%" stop-color="#fbbf24"/>
              <stop offset="100%" stop-color="#4ade80"/>
            </linearGradient>
          </defs>
          <path d="M 80 200 A 120 120 0 0 1 320 200" fill="none" stroke="#e5e5e5" stroke-width="8" stroke-linecap="round"/>
          <path d="M 80 200 A 120 120 0 0 1 320 200" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
          <circle cx="285" cy="128" r="10" fill="#fff" stroke="#4ade80" stroke-width="3"/>
          <circle cx="285" cy="128" r="5" fill="#4ade80"/>
          <text x="200" y="222" font-family="'Inter',-apple-system,sans-serif" font-size="120" font-weight="200" fill="#09090b" text-anchor="middle" letter-spacing="-4">F</text>
          <circle cx="200" cy="260" r="6" fill="#4ade80"/>
        </svg>
      </div>
      <span>Claro</span>
    </div>

    <div class="box">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="160" height="160">
        <rect width="400" height="400" rx="88" fill="#4ade80"/>
        <circle cx="200" cy="200" r="130" fill="none" stroke="#22c55e" stroke-width="2"/>
        <path d="M 80 200 A 120 120 0 0 1 320 200" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round"/>
        <path d="M 80 200 A 120 120 0 0 1 320 200" fill="none" stroke="#09090b" stroke-width="8" stroke-linecap="round" stroke-dasharray="240 0"/>
        <circle cx="285" cy="128" r="10" fill="#4ade80" stroke="#09090b" stroke-width="3"/>
        <circle cx="285" cy="128" r="5" fill="#09090b"/>
        <text x="200" y="222" font-family="'Inter',-apple-system,sans-serif" font-size="120" font-weight="200" fill="#09090b" text-anchor="middle" letter-spacing="-4">F</text>
        <circle cx="200" cy="260" r="6" fill="#09090b"/>
      </svg>
      <span>Verde</span>
    </div>
  </div>
</div>

<hr/>

<div class="section">
  <p class="label">Wordmark horizontal</p>
  <div class="row">
    <div class="box">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
        <defs>
          <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#f87171"/>
            <stop offset="50%" stop-color="#fbbf24"/>
            <stop offset="100%" stop-color="#4ade80"/>
          </linearGradient>
        </defs>
        <!-- Icon -->
        <rect x="0" y="0" width="80" height="80" rx="18" fill="#09090b" stroke="#1c1c1f" stroke-width="1"/>
        <path d="M 12 40 A 28 28 0 0 1 68 40" fill="none" stroke="#1c1c1f" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M 12 40 A 28 28 0 0 1 68 40" fill="none" stroke="url(#g3)" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="62" cy="19" r="5" fill="#09090b" stroke="#4ade80" stroke-width="2"/>
        <circle cx="62" cy="19" r="2.5" fill="#4ade80"/>
        <text x="40" y="55" font-family="'Inter',-apple-system,sans-serif" font-size="38" font-weight="200" fill="#f4f4f5" text-anchor="middle">F</text>
        <circle cx="40" cy="67" r="3" fill="#4ade80"/>
        <!-- Word -->
        <text x="96" y="56" font-family="'Inter',-apple-system,sans-serif" font-size="44" font-weight="200" fill="#f4f4f5" letter-spacing="-2">foc</text>
        <text x="263" y="56" font-family="'Inter',-apple-system,sans-serif" font-size="44" font-weight="200" fill="#f4f4f5" letter-spacing="-2">◎</text>
      </svg>
      <span>Wordmark oscuro</span>
    </div>
  </div>
</div>

<hr/>

<div class="section">
  <p class="label">Ícono pequeño — favicon / app icon</p>
  <div class="row">
    <div class="box">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
        <rect width="64" height="64" rx="14" fill="#09090b"/>
        <defs>
          <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#f87171"/>
            <stop offset="50%" stop-color="#fbbf24"/>
            <stop offset="100%" stop-color="#4ade80"/>
          </linearGradient>
        </defs>
        <path d="M 10 32 A 22 22 0 0 1 54 32" fill="none" stroke="#1c1c1f" stroke-width="3" stroke-linecap="round"/>
        <path d="M 10 32 A 22 22 0 0 1 54 32" fill="none" stroke="url(#g4)" stroke-width="3" stroke-linecap="round"/>
        <circle cx="49" cy="18" r="4" fill="#09090b" stroke="#4ade80" stroke-width="2"/>
        <circle cx="49" cy="18" r="2" fill="#4ade80"/>
        <text x="32" y="44" font-family="'Inter',-apple-system,sans-serif" font-size="28" font-weight="200" fill="#f4f4f5" text-anchor="middle">F</text>
        <circle cx="32" cy="52" r="2.5" fill="#4ade80"/>
      </svg>
      <span>64×64</span>
    </div>

    <div class="box">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="48" height="48">
        <rect width="64" height="64" rx="14" fill="#09090b"/>
        <defs>
          <linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#f87171"/>
            <stop offset="50%" stop-color="#fbbf24"/>
            <stop offset="100%" stop-color="#4ade80"/>
          </linearGradient>
        </defs>
        <path d="M 10 32 A 22 22 0 0 1 54 32" fill="none" stroke="#1c1c1f" stroke-width="3" stroke-linecap="round"/>
        <path d="M 10 32 A 22 22 0 0 1 54 32" fill="none" stroke="url(#g5)" stroke-width="3" stroke-linecap="round"/>
        <circle cx="49" cy="18" r="4" fill="#09090b" stroke="#4ade80" stroke-width="2"/>
        <circle cx="49" cy="18" r="2" fill="#4ade80"/>
        <text x="32" y="44" font-family="'Inter',-apple-system,sans-serif" font-size="28" font-weight="200" fill="#f4f4f5" text-anchor="middle">F</text>
        <circle cx="32" cy="52" r="2.5" fill="#4ade80"/>
      </svg>
      <span>48×48</span>
    </div>

    <div class="box">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="32" height="32">
        <rect width="64" height="64" rx="14" fill="#09090b"/>
        <defs>
          <linearGradient id="g6" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#f87171"/>
            <stop offset="50%" stop-color="#fbbf24"/>
            <stop offset="100%" stop-color="#4ade80"/>
          </linearGradient>
        </defs>
        <path d="M 10 32 A 22 22 0 0 1 54 32" fill="none" stroke="#1c1c1f" stroke-width="3" stroke-linecap="round"/>
        <path d="M 10 32 A 22 22 0 0 1 54 32" fill="none" stroke="url(#g6)" stroke-width="3" stroke-linecap="round"/>
        <circle cx="49" cy="18" r="4" fill="#09090b" stroke="#4ade80" stroke-width="2"/>
        <circle cx="49" cy="18" r="2" fill="#4ade80"/>
        <text x="32" y="44" font-family="'Inter',-apple-system,sans-serif" font-size="28" font-weight="200" fill="#f4f4f5" text-anchor="middle">F</text>
        <circle cx="32" cy="52" r="2.5" fill="#4ade80"/>
      </svg>
      <span>32×32</span>
    </div>

    <div class="box">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="16" height="16">
        <rect width="64" height="64" rx="14" fill="#09090b"/>
        <text x="32" y="46" font-family="'Inter',-apple-system,sans-serif" font-size="36" font-weight="700" fill="#4ade80" text-anchor="middle">F</text>
      </svg>
      <span>16×16</span>
    </div>
  </div>
</div>

<hr/>

<div class="section">
  <p class="label">Solo texto — para usar en la app</p>
  <div class="row">
    <div class="box">
      <span style="font-size:32px;font-weight:700;color:#4ade80;letter-spacing:0.1em">FOC◎</span>
      <span>Texto app</span>
    </div>
    <div class="box">
      <span style="font-size:24px;font-weight:200;color:#f4f4f5;letter-spacing:-1px">foco</span>
      <span>Texto delgado</span>
    </div>
    <div class="box">
      <span style="font-size:18px;font-weight:700;color:#4ade80;letter-spacing:0.14em">FOCO</span>
      <span>Label</span>
    </div>
  </div>
</div>

</body>
</html>
